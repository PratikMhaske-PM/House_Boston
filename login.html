<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NEXA ESTATE AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar scrolled">
        <a href="index.html" class="logo">NEXA / ESTATE AI</a>
    </nav>
    <div class="auth-layout">
        <div class="auth-image">
            <h2 style="color: white; font-size: 3rem; font-weight: 300;">Private Property<br>Intelligence</h2>
        </div>
        <div class="auth-form-container">
            <div class="auth-form">
                <h2>Welcome back.</h2>
                <form id="nexa-login">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="admin@gmail.com">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" required placeholder="admin@123">
                    </div>
                    <div id="login-error" class="error-msg hidden">Invalid credentials. Access denied.</div>
                    <button type="submit" class="btn btn-primary w-100">Access Dashboard &rarr;</button>
                </form>
                <div class="form-footer">
                    <strong style="color: var(--text-main);">Demo Environment</strong><br>
                    Authentication is handled locally for demonstration purposes.
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
